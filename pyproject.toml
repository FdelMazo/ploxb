[project]
name = "ploxb"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mypy>=1.19.1",
    "platformdirs>=4.5.1",
    "prompt-toolkit>=3.0.51",
    "termcolor>=3.3.0",
]

[project.scripts]
ploxb = "ploxb.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
